<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dream & Fly</title>

    <style>
      body {
        font-family: Nunito !important;
        overflow-x: hidden;
        background-color: rgba(0, 0, 0, 0.5) !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        background: #ffffff;
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        height: 90%;
        border-radius: 20px;
        padding: 14px 28px;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 50%;
      }

      .background-logo {
        width: 50%;
        height: 100%;
      }

      img {
        width: 100%;
        height: 100%;
      }

      #localAccountForm {
        width: 100% !important;
      }

      @font-face {
        font-family: "Nunito";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/NunitoSans_7pt_Condensed-Regular.ttf")
          format("truetype");
      }

      @font-face {
        font-family: "Urbanist";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/Urbanist-Black.ttf")
          format("truetype");
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #eaeaea !important;
        margin-bottom: 1rem;
        outline: 0;
      }

      input[type="text"]::placeholder,
      input[type="email"]::placeholder,
      input[type="password"]::placeholder {
        color: #cacaca;
      }

      .heading,
      .intro {
        display: none !important;
      }
      #api {
        width: 60% !important;
      }
      .entry-item label {
        display: none !important;
      }
      #forgotPassword {
        color: #86c3f1;
        text-decoration: none;
        position: relative;
        top: 85px;
        left: 71%;
      }

      .create {
        padding: 12px 0;
      }
      .create p {
        text-align: center;
        color: #6b7280;
      }

      .create #createAccount {
        color: #369be7;
        font-weight: 600;
        text-decoration: none;
        padding: 10px;
      }

      .divider h2 {
        display: none !important;
      }

      #next {
        width: 100%;
        padding: 0.6rem;
        margin-top: 14px;
        border-radius: 0.5rem;
        background: #369be7;
        color: white;
        border: none;
      }

      /* /////////////////////////////////////////////////////// */
    </style>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <main>
      <section>
        <div>
          <h1 role="heading" style="font-weight: 600">
            Log in to your accountLog in to your account
          </h1>

          <p aria-level="1" style="color: #242456; font-size: 14px">
            Welcome back! Log in using your email address
          </p>
        </div>
        <form id="api" method="post" autocomplete="off">
          <input
            id="email"
            name="Email Address"
            type="text"
            placeholder="Email Address"
            required
          />

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            required
          />

          <button id="next" type="submit" form="localAccountForm">Login</button>
        </form>
      </section>

      <div class="background-logo">
        <img
          src="https://ahmedgamalemam.github.io/dream_fly_signin//images/light-bg.png"
          alt="logo"
        />
      </div>
    </main>
  </body>
</html>
